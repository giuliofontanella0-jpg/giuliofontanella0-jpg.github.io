<!doctype html>
<html lang="{{ site.lang | default: 'it' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#120d16">
  <title>{% if page.titolo %}{{ page.titolo }} · {% elsif page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/elindor.css' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M17 2 13 11l5 4-6 8 3 7' fill='none' stroke='%238fd0e8' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body class="{{ page.classe | default: 'pagina' }}">
  <canvas id="cielo" aria-hidden="true"></canvas>
  <a class="salta" href="#contenuto">Vai al contenuto</a>
  <header class="testata">
    <a class="marchio" href="{{ '/' | relative_url }}">Cronache di Elindor</a>
    <nav aria-label="Menu principale">
      <ul>
        <li><a href="{{ '/' | relative_url }}#cronaca"{% if page.url == '/' %} aria-current="page"{% endif %}>Sessioni</a></li>
        <li><a href="{{ '/mappa.html' | relative_url }}"{% if page.url == '/mappa.html' %} aria-current="page"{% endif %}>Mappa</a></li>
        <li><a href="{{ '/lore.html' | relative_url }}"{% if page.url == '/lore.html' %} aria-current="page"{% endif %}>Lore</a></li>
        <li><a href="{{ '/personaggi.html' | relative_url }}"{% if page.url == '/personaggi.html' %} aria-current="page"{% endif %}>Personaggi</a></li>
      </ul>
    </nav>
  </header>

  <main id="contenuto">
    {{ content }}
  </main>

  {% unless page.senza_piede %}
  <footer class="piede">
    <p>Cronache della campagna di Dungeons &amp; Dragons ambientata nel mondo di Elindor.</p>
  </footer>
  {% endunless %}
  <script>
  /* Cielo stellato: disegnato una volta, ridisegnato se cambia la finestra */
  (function () {
    var cielo = document.getElementById('cielo');
    if (!cielo || !cielo.getContext) return;
    function disegna() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var w = window.innerWidth, h = window.innerHeight;
      cielo.width = w * dpr; cielo.height = h * dpr;
      var c = cielo.getContext('2d');
      c.scale(dpr, dpr);
      var seme = 13;
      function caso() { seme = (seme * 16807) % 2147483647; return seme / 2147483647; }
      var n = Math.round(w * h / 2600);
      for (var k = 0; k < n; k++) {
        var x = caso() * w, y = caso() * h, r = caso() < .92 ? caso() * .9 + .2 : caso() * 1.4 + .9;
        c.globalAlpha = .25 + caso() * .6;
        c.fillStyle = caso() < .15 ? '#cfc4ff' : (caso() < .2 ? '#ffe3a8' : '#f4eee0');
        c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
      }
    }
    disegna();
    var t; window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(disegna, 150); });
  })();
  </script>
</body>
</html>
