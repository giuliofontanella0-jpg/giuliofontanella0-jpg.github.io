<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Il Rotolo delle Isole — Elindor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b1d12;
    --oro:#d3ab5e;
    --oro-chiaro:#ecd9a8;
    --arcano:#8f7fd8;
    --arcano-blu:#79b9d6;
    --cera:#8e2f2f;
    --allarme:#c96a4a;
    --notte:#191218;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse 120% 80% at 50% -10%, #322338 0%, transparent 60%),
      radial-gradient(ellipse 100% 70% at 50% 110%, #2a2013 0%, transparent 55%),
      var(--notte);
    color:var(--oro-chiaro);
    font-family:'EB Garamond', Georgia, serif;
    display:flex;
    justify-content:center;
    padding:28px 14px 48px;
    overflow-x:hidden;
  }

  /* Pulviscolo arcano di sottofondo */
  .mote{
    position:fixed;
    border-radius:50%;
    background:radial-gradient(circle, rgba(143,127,216,.8), transparent 70%);
    pointer-events:none;
    z-index:0;
    animation:deriva linear infinite;
    opacity:0;
  }
  @keyframes deriva{
    0%  { transform:translateY(0); opacity:0; }
    15% { opacity:.55; }
    85% { opacity:.55; }
    100%{ transform:translateY(-110vh); opacity:0; }
  }

  .stage{ width:100%; max-width:560px; text-align:center; position:relative; z-index:1; }

  h1{
    font-family:'Cinzel', Georgia, serif;
    font-weight:700;
    font-size:clamp(1.5rem, 6vw, 2.3rem);
    letter-spacing:.09em;
    color:var(--oro);
    text-shadow:0 2px 10px rgba(0,0,0,.6);
  }
  h1::after{
    content:"";
    display:block;
    width:110px; height:2px;
    margin:12px auto 0;
    background:linear-gradient(90deg, transparent, var(--oro), transparent);
  }

  .epigrafe{
    font-style:italic;
    font-size:clamp(1.02rem, 3.6vw, 1.2rem);
    color:#cdb88d;
    margin:16px auto 14px;
    max-width:46ch;
    line-height:1.5;
  }

  /* I versi dell'enigma */
  .enigma{
    white-space:pre-line;
    font-size:clamp(.98rem, 3.4vw, 1.12rem);
    line-height:1.65;
    color:#d9c69a;
    background:rgba(50,38,26,.5);
    border:1px solid #5d4a2e;
    border-radius:10px;
    padding:14px 18px;
    margin:0 auto 10px;
    max-width:46ch;
    box-shadow:inset 0 0 18px rgba(0,0,0,.35);
  }
  .enigma::first-line{
    font-family:'Cinzel', Georgia, serif;
    font-size:.85em;
    letter-spacing:.08em;
    color:var(--oro);
  }

  .suggerimento{
    font-size:.95rem;
    color:#93805f;
    margin-bottom:22px;
    max-width:44ch;
    margin-left:auto;
    margin-right:auto;
    line-height:1.45;
    min-height:1.3em;
    transition:opacity .8s, color .8s;
  }
  .suggerimento.grave{ color:#a5624a; font-style:italic; }

  /* ── Il rotolo ─────────────────────────────── */
  .scroll{ position:relative; }
  .scroll.shake{ animation:scossa .55s ease-out; }
  @keyframes scossa{
    0%,100%{ transform:translate(0,0); }
    20%{ transform:translate(-5px,2px); }
    40%{ transform:translate(5px,-2px); }
    60%{ transform:translate(-4px,-2px); }
    80%{ transform:translate(3px,2px); }
  }

  .roller{
    height:26px;
    width:calc(100% + 34px);
    margin-left:-17px;
    border-radius:13px;
    background:linear-gradient(180deg, #7d5836 0%, #5a3d23 55%, #3c2917 100%);
    box-shadow:0 3px 8px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,220,160,.25);
    position:relative;
    z-index:3;
  }
  .roller::before, .roller::after{
    content:"";
    position:absolute;
    top:50%; transform:translateY(-50%);
    width:20px; height:20px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #e8c47c, #9a7132 65%, #5f431d);
    box-shadow:0 2px 5px rgba(0,0,0,.6);
  }
  .roller::before{ left:-6px; }
  .roller::after{ right:-6px; }

  /* Apertura del rotolo: da chiuso (0fr) a srotolato (1fr) */
  .unroll{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows 1.5s cubic-bezier(.7,0,.25,1);
  }
  .scroll.open .unroll{ grid-template-rows:1fr; }

  .paper{
    position:relative;
    margin:-6px 0;
    padding:14px;
    min-height:0;
    overflow:hidden;
    background:linear-gradient(180deg, #d9c496 0%, #cdb582 50%, #c0a672 100%);
    box-shadow:
      inset 0 0 34px rgba(74,51,32,.45),
      0 10px 30px rgba(0,0,0,.5);
    z-index:2;
  }

  /* Tre colonne verticali: ognuna mostra un custode e ruota tra i tre */
  .bands{
    display:flex;
    flex-direction:row;
    gap:8px;
    background:#241a10;
    transition:gap .8s ease;
  }

  .band{
    display:block;
    flex:1;
    position:relative;
    overflow:hidden;
    border:none;
    padding:0;
    background:#d8c395;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .band:focus-visible{
    outline:3px solid var(--oro);
    outline-offset:-3px;
    z-index:4;
  }

  .strip{
    position:absolute;
    inset:0;
    background-repeat:repeat-y;
    background-size:100% 300%;
    transition:background-position-y .55s cubic-bezier(.65,.05,.35,1);
    pointer-events:none;
  }

  .band .icona{
    position:absolute;
    bottom:10px; left:50%;
    transform:translateX(-50%);
    width:30px; height:30px;
    border-radius:50%;
    background:rgba(28,21,16,.55);
    color:var(--oro-chiaro);
    font-size:17px;
    line-height:30px;
    text-align:center;
    opacity:.85;
    transition:opacity .4s, transform .2s;
    pointer-events:none;
  }
  .band:active .icona{ transform:translateX(-50%) translateY(4px); }

  /* La mappa nascosta: si materializza solo a combinazione esatta */
  .quadro{
    position:absolute;
    inset:14px;
    background-size:100% 100%;
    background-repeat:no-repeat;
    opacity:0;
    transform:scale(1.02);
    transition:opacity 2.4s ease .4s, transform 2.4s ease .4s;
    pointer-events:none;
    z-index:4;
  }
  .scroll.solved .quadro{ opacity:1; transform:scale(1); }

  /* ── Sigillo di cera ───────────────────────── */
  .sigillo-wrap{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:8;
  }
  .sigillo-wrap.via{ pointer-events:none; visibility:hidden; }
  .sigillo{
    width:104px; height:104px;
    border-radius:48% 52% 50% 50% / 52% 48% 52% 48%;
    border:none;
    cursor:pointer;
    background:radial-gradient(circle at 36% 30%, #c05252, var(--cera) 55%, #571a1a 100%);
    box-shadow:
      0 6px 18px rgba(0,0,0,.65),
      inset 0 3px 6px rgba(255,180,160,.35),
      inset 0 -5px 10px rgba(40,8,8,.7);
    color:#f3d9c2;
    font-size:2.1rem;
    text-shadow:0 1px 2px rgba(60,10,10,.9), 0 0 12px rgba(255,200,170,.35);
    transition:transform .2s, background .8s, color .8s;
    animation:pulsazione 2.8s ease-in-out infinite;
  }
  .sigillo:hover{ transform:scale(1.05); }
  @keyframes pulsazione{
    0%,100%{ box-shadow:0 6px 18px rgba(0,0,0,.65), inset 0 3px 6px rgba(255,180,160,.35), inset 0 -5px 10px rgba(40,8,8,.7), 0 0 0 rgba(143,127,216,0); }
    50%    { box-shadow:0 6px 18px rgba(0,0,0,.65), inset 0 3px 6px rgba(255,180,160,.35), inset 0 -5px 10px rgba(40,8,8,.7), 0 0 26px rgba(143,127,216,.55); }
  }
  .sigillo.crack{
    animation:frantuma .5s ease-in forwards;
  }
  @keyframes frantuma{
    30% { transform:scale(1.18) rotate(-7deg); opacity:1; }
    100%{ transform:scale(1.5) rotate(9deg); opacity:0; }
  }
  /* Sigillo spento: il rotolo è bloccato */
  .sigillo.spento{
    background:radial-gradient(circle at 36% 30%, #5e5a5a, #423c3c 55%, #262121 100%);
    color:#8d8383;
    text-shadow:none;
    cursor:not-allowed;
    animation:none;
    box-shadow:0 6px 18px rgba(0,0,0,.65), inset 0 3px 6px rgba(120,110,110,.2), inset 0 -5px 10px rgba(15,10,10,.7);
  }
  .sigillo.spento:hover{ transform:none; }

  /* ── Lampo e stato risolto ─────────────────── */
  .flash{
    position:absolute;
    inset:0;
    background:radial-gradient(circle, rgba(200,225,255,.95) 0%, rgba(143,127,216,.5) 55%, transparent 80%);
    opacity:0;
    pointer-events:none;
    z-index:7;
  }
  .flash.go{ animation:lampo 1s ease-out forwards; }
  .flash.rosso{
    background:radial-gradient(circle, rgba(220,110,80,.85) 0%, rgba(120,35,35,.5) 55%, transparent 80%);
  }
  @keyframes lampo{
    0%  { opacity:0; }
    14% { opacity:.95; }
    100%{ opacity:0; }
  }

  .scroll.solved .bands{ gap:0; }
  .scroll.solved .band{ cursor:default; }
  .scroll.solved .icona{ opacity:0; }
  .scroll.solved .paper{
    animation:bagliore 3.2s ease-in-out infinite;
  }
  @keyframes bagliore{
    0%,100%{ box-shadow:inset 0 0 34px rgba(74,51,32,.45), 0 0 30px rgba(143,127,216,.4); }
    50%    { box-shadow:inset 0 0 34px rgba(74,51,32,.45), 0 0 58px rgba(121,185,214,.65); }
  }

  .reveal{
    position:absolute;
    inset:14px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    align-items:center;
    gap:6px;
    padding-bottom:24px;
    background:linear-gradient(180deg, transparent 0%, transparent 55%, rgba(20,13,24,.84) 100%);
    opacity:0;
    visibility:hidden;
    transition:opacity 1.4s ease 1.6s, visibility 0s 3s;
    pointer-events:none;
    z-index:5;
  }
  .scroll.solved .reveal{
    opacity:1;
    visibility:visible;
    transition:opacity 1.4s ease 1.6s;
  }
  .reveal .stella{ font-size:1.4rem; color:var(--arcano-blu); text-shadow:0 0 14px rgba(121,185,214,.95); }
  .reveal h2{
    font-family:'Cinzel', Georgia, serif;
    font-weight:700;
    font-size:clamp(1.3rem, 5.6vw, 1.9rem);
    letter-spacing:.12em;
    color:var(--oro-chiaro);
    text-shadow:0 0 18px rgba(143,127,216,.9), 0 2px 6px rgba(0,0,0,.95);
  }
  .reveal h2 span{
    opacity:0;
    display:inline-block;
    animation:lettera .6s ease forwards;
  }
  @keyframes lettera{
    from{ opacity:0; transform:translateY(10px); }
    to  { opacity:1; transform:translateY(0); }
  }
  .reveal p{
    font-style:italic;
    font-size:clamp(.95rem, 3.4vw, 1.08rem);
    color:#e6d5a9;
    text-shadow:0 1px 4px rgba(0,0,0,.9);
    max-width:40ch;
  }
  .reveal .conto{
    font-style:normal;
    font-family:'Cinzel', Georgia, serif;
    font-size:.85rem;
    letter-spacing:.1em;
    color:var(--arcano-blu);
  }

  .scintilla{
    position:absolute;
    bottom:-4%;
    color:var(--arcano-blu);
    text-shadow:0 0 8px rgba(143,127,216,.95);
    animation:sali linear forwards;
    pointer-events:none;
    z-index:6;
  }
  .scintilla.oro{ color:var(--oro); text-shadow:0 0 8px rgba(232,196,124,.9); }
  @keyframes sali{
    0%  { transform:translateY(0) scale(.5); opacity:0; }
    12% { opacity:1; }
    100%{ transform:translateY(-520px) scale(1.1) rotate(50deg); opacity:0; }
  }

  /* ── Comandi ───────────────────────────────── */
  .comandi{
    margin-top:26px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
  }
  .giri-conto{
    font-family:'Cinzel', Georgia, serif;
    font-size:.92rem;
    letter-spacing:.08em;
    color:#93805f;
    transition:color .5s;
  }
  .giri-conto.allarme{ color:var(--allarme); }
  .bottone{
    font-family:'Cinzel', Georgia, serif;
    font-size:.92rem;
    letter-spacing:.08em;
    color:var(--oro-chiaro);
    background:linear-gradient(180deg, #5c4023, #3d2a16);
    border:1px solid #8a6a3c;
    border-radius:8px;
    padding:10px 18px;
    cursor:pointer;
    box-shadow:0 3px 8px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,220,160,.2);
    transition:transform .15s, box-shadow .15s;
  }
  .bottone:hover{ transform:translateY(-1px); box-shadow:0 5px 12px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,220,160,.25); }
  .bottone:active{ transform:translateY(1px); }
  .bottone.suono{ padding:10px 14px; min-width:52px; }

  /* ── Pannello del Master (solo con ?dm=1) ──── */
  .dm{
    display:none;
    margin-top:22px;
    padding:14px;
    border:1px dashed #6b5a3a;
    border-radius:10px;
    background:rgba(40,30,20,.55);
    font-size:.9rem;
    color:#b9a478;
  }
  body.dm-attivo .dm{ display:block; }
  .dm .dm-riga{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .dm .dm-titolo{
    font-family:'Cinzel', Georgia, serif;
    letter-spacing:.1em;
    font-size:.8rem;
    color:var(--oro);
    margin-bottom:10px;
  }
  .dm .bottone{ font-size:.82rem; padding:8px 14px; }

  @media (prefers-reduced-motion: reduce){
    .strip, .bands, .reveal, .bottone, .unroll, .quadro{ transition:none !important; }
    .scroll.solved .paper, .sigillo, .mote{ animation:none !important; }
    .scroll.shake, .flash.go{ animation:none !important; }
    .scroll.solved .paper{ box-shadow:inset 0 0 34px rgba(74,51,32,.45), 0 0 44px rgba(143,127,216,.55); }
    .scroll.solved .quadro{ opacity:1; transform:none; }
    .reveal h2 span{ animation:none; opacity:1; }
    .scintilla, .mote{ display:none; }
  }
</style>
</head>
<body>
<div class="stage">
  <h1 id="titolo"></h1>
  <p class="epigrafe" id="epigrafe"></p>
  <p class="enigma" id="enigma"></p>
  <p class="suggerimento" id="suggerimento">&nbsp;</p>

  <div class="scroll" id="scroll">
    <div class="roller" aria-hidden="true"></div>
    <div class="unroll">
      <div class="paper" id="paper">
        <div class="bands" id="bands">
          <button class="band" aria-label="Muta il custode della colonna sinistra">
            <span class="strip"></span>
            <span class="icona" aria-hidden="true">&#8595;</span>
          </button>
          <button class="band" aria-label="Muta il custode della colonna centrale">
            <span class="strip"></span>
            <span class="icona" aria-hidden="true">&#8595;</span>
          </button>
          <button class="band" aria-label="Muta il custode della colonna destra">
            <span class="strip"></span>
            <span class="icona" aria-hidden="true">&#8595;</span>
          </button>
        </div>
        <div class="quadro" id="quadro" aria-hidden="true"></div>
        <div class="reveal" aria-live="polite">
          <span class="stella">&#10022;</span>
          <h2 id="vittoriaTitolo"></h2>
          <p id="vittoriaTesto"></p>
          <p class="conto" id="vittoriaConto"></p>
        </div>
        <div class="flash" id="flash"></div>
      </div>
    </div>
    <div class="roller" aria-hidden="true"></div>

    <div class="sigillo-wrap" id="sigilloWrap">
      <button class="sigillo" id="sigillo" aria-label="Il sigillo del rotolo">&#10022;</button>
    </div>
  </div>

  <div class="comandi">
    <span class="giri-conto" id="giriConto" aria-live="polite"></span>
    <button class="bottone suono" id="suono" aria-pressed="true" aria-label="Attiva o disattiva i suoni">&#119070;</button>
  </div>

  <div class="dm" id="dmPanel">
    <p class="dm-titolo">Pannello del Master</p>
    <div class="dm-riga">
      <span id="dmStato">&mdash;</span>
      <span id="dmSoluzione"></span>
    </div>
    <div class="dm-riga" style="margin-top:10px">
      <button class="bottone" id="dmSblocca">Rimuovi blocco</button>
      <button class="bottone" id="dmRimescola">Rimescola</button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   REGOLE — modifica qui limite di giri e durata del blocco
   ═══════════════════════════════════════════════════════════ */
const GIRI_MASSIMI = 10;     // tentativi concessi prima del blocco
const ORE_BLOCCO   = 24;     // ore di attesa dopo il fallimento

/* ═══════════════════════════════════════════════════════════
   LA SOLUZIONE — l'ordine dei custodi da sinistra a destra.
   Valori possibili: 'sole', 'luna', 'stella'.
   Se la cambi, riscrivi anche i versi dell'enigma qui sotto!
   ═══════════════════════════════════════════════════════════ */
const SOLUZIONE = ['luna', 'sole', 'stella'];

/* ═══════════════════════════════════════════════════════════
   TESTI — modifica qui liberamente titolo, enigma e messaggi
   ═══════════════════════════════════════════════════════════ */
const TESTI = {
  titolo:         "",   // titolo mostrato in pagina (vuoto = nascosto)
  titoloScheda:   "Il Rotolo delle Isole \u2014 Elindor",   // nome della scheda del browser
  epigrafe:       "\u00ABNon chi impara a volare ma chi sogna di farlo\u00BB",
  enigma:         "L'ENIGMA DEI TRE CUSTODI\nTre custodi governano il rotolo: il Sole, la Luna e la Stella. Un posto per ciascuno.\nIl Sole rifugge i margini del cielo.\nLa Luna veglia dove il giorno muore.\nAlla Stella spetta il posto che resta.",
  suggerimento:   "Tocca le colonne per mutare i custodi.",
  bloccato:       "Il rotolo si \u00E8 richiuso su se stesso. I custodi devono riposare: tornate quando le stelle avranno compiuto il loro giro.",
  vittoriaTitolo: "Le Isole Fluttuanti",
  vittoriaTesto:  "I custodi sono al loro posto: la rotta verso le isole \u00E8 svelata.",
  vittoriaConto:  "Svelato in {n} giri",
  contatore:      "Giri: {n} / {max}"
};

/* ═══════════════════════════════════════════════════════════
   IMMAGINE DELLA MAPPA (incorporata in base64: nessun file esterno)
   ═══════════════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════════
   SALVATAGGIO (sopravvive alla chiusura del sito)
   ═══════════════════════════════════════════════════════════ */
function salvaStato(){
  try{ localStorage.setItem(CHIAVE_STATO, JSON.stringify({ giri, mosse })); }catch(e){}
}
function caricaStato(){
  try{
    const raw = localStorage.getItem(CHIAVE_STATO);
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(Array.isArray(s.giri) && s.giri.length === 3 && typeof s.mosse === 'number') return s;
  }catch(e){}
  return null;
}
function cancellaStato(){
  try{ localStorage.removeItem(CHIAVE_STATO); }catch(e){}
}
function fineBlocco(){
  try{
    const t = parseInt(localStorage.getItem(CHIAVE_BLOCCO), 10);
    return isNaN(t) ? 0 : t;
  }catch(e){ return 0; }
}
function eBloccato(){ return fineBlocco() > Date.now(); }
function impostaBlocco(){
  const scadenza = Date.now() + ORE_BLOCCO * 3600 * 1000;
  try{ localStorage.setItem(CHIAVE_BLOCCO, String(scadenza)); }catch(e){}
  scriviBloccoRemoto(scadenza);
}
function rimuoviBloccoLocale(){
  try{ localStorage.removeItem(CHIAVE_BLOCCO); }catch(e){}
}
/* Sblocco per tutti: usato dal pannello del Master */
function sbloccaGlobale(){
  rimuoviBloccoLocale();
  scriviBloccoRemoto(0);
}

/* ── Sincronizzazione col database condiviso ──
   Se la rete non risponde, la pagina ripiega sul salvataggio
   locale del browser e il gioco continua a funzionare. */
let reteOk = null;
async function leggiBloccoRemoto(){
  try{
    const r = await fetch(FIREBASE_DB + '/blocco.json', { cache:'no-store' });
    if(!r.ok) throw new Error('http ' + r.status);
    const v = await r.json();
    reteOk = true;
    return (typeof v === 'number') ? v : 0;
  }catch(e){ reteOk = false; return null; }
}
async function scriviBloccoRemoto(ts){
  try{
    const r = await fetch(FIREBASE_DB + '/blocco.json', { method:'PUT', body: JSON.stringify(ts) });
    reteOk = r.ok;
  }catch(e){ reteOk = false; }
}
async function sincronizzaBlocco(){
  const remoto = await leggiBloccoRemoto();
  if(remoto === null){ aggiornaDm(); return; }
  if(remoto > Date.now()){
    try{ localStorage.setItem(CHIAVE_BLOCCO, String(remoto)); }catch(e){}
    if(!bloccato) applicaBlocco();
  } else {
    rimuoviBloccoLocale();
    if(bloccato) riattiva();
  }
  aggiornaDm();
}

/* ═══════════════════════════════════════════════════════════
   LOGICA DELL'ENIGMA
   ═══════════════════════════════════════════════════════════ */
let giri = [0, 0, 0];
let mosse = 0;
let risolto = false;
let aperto = false;
let bloccato = false;

function simboloDi(i){ return SIMBOLI[giri[i] % 3]; }
function combinazioneEsatta(){ return bands.every((_, i) => simboloDi(i) === SOLUZIONE[i]); }

function applica(i, animato = true){
  const h = bands[i].clientHeight;
  if(!animato) strips[i].style.transition = 'none';
  strips[i].style.backgroundPositionY = (-giri[i] * h) + 'px';
  if(!animato){
    strips[i].offsetHeight; // forza il reflow
    strips[i].style.transition = '';
  }
}

function aggiornaContatore(){
  giriConto.textContent = TESTI.contatore.replace('{n}', mosse).replace('{max}', GIRI_MASSIMI);
  giriConto.classList.toggle('allarme', GIRI_MASSIMI - mosse <= 3 && !risolto);
}

function mescola(){
  risolto = false;
  mosse = 0;
  scroll.classList.remove('solved');
  do {
    giri = giri.map(() => Math.floor(Math.random() * 3));
  } while (combinazioneEsatta());
  bands.forEach((_, i) => applica(i, false));
  salvaStato();
  aggiornaContatore();
}

function vittoria(){
  risolto = true;
  cancellaStato();
  setTimeout(() => {
    scroll.classList.add('solved');
    scroll.classList.add('shake');
    flash.classList.remove('go', 'rosso'); void flash.offsetWidth; flash.classList.add('go');
    document.getElementById('vittoriaConto').textContent = TESTI.vittoriaConto.replace('{n}', mosse);
    suonoVittoria();
    scintille();
    setTimeout(() => scroll.classList.remove('shake'), 700);
  }, 580);
}

function fallimento(){
  impostaBlocco();
  cancellaStato();
  setTimeout(() => {
    flash.classList.remove('go'); flash.classList.add('rosso'); void flash.offsetWidth; flash.classList.add('go');
    scroll.classList.add('shake');
    suonoFallimento();
    setTimeout(() => scroll.classList.remove('shake'), 700);
    setTimeout(applicaBlocco, 900);
  }, 580);
}

/* Chiude il rotolo e spegne il sigillo */
function applicaBlocco(){
  bloccato = true;
  aperto = false;
  risolto = false;
  scroll.classList.remove('open', 'solved');
  sigillo.classList.remove('crack');
  sigillo.classList.add('spento');
  sigilloWrap.classList.remove('via');
  suggerimento.textContent = TESTI.bloccato;
  suggerimento.classList.add('grave');
  giriConto.textContent = '';
  aggiornaDm();
}

/* Riapre il gioco quando il blocco è scaduto */
function riattiva(){
  bloccato = false;
  rimuoviBloccoLocale();
  sigillo.classList.remove('spento');
  suggerimento.textContent = '\u00A0';
  suggerimento.classList.remove('grave');
  mescola();
  aggiornaDm();
}

/* Controllo periodico: se il blocco scade mentre la pagina è aperta */
setInterval(() => {
  if(bloccato && !eBloccato()) riattiva();
  sincronizzaBlocco();
}, 30000);

bands.forEach((band, i) => {
  band.addEventListener('click', () => {
    if(risolto || !aperto || bloccato) return;
    mosse++;
    giri[i]++;
    applica(i);
    salvaStato();
    aggiornaContatore();
    suonoGiro();
    if(combinazioneEsatta()){
      vittoria();
    } else if(mosse >= GIRI_MASSIMI){
      fallimento();
    }
  });
});

// Al ridimensionamento (rotazione del telefono ecc.) ricalcola le posizioni
let timerResize;
window.addEventListener('resize', () => {
  clearTimeout(timerResize);
  timerResize = setTimeout(() => bands.forEach((_, i) => applica(i, false)), 120);
});

/* ── Sigillo di cera ─────────────────────────── */
sigillo.addEventListener('click', () => {
  avviaAudio();
  if(!bloccato) sincronizzaBlocco();
  if(bloccato){
    // Il sigillo non cede: piccolo tonfo sordo
    scroll.classList.add('shake');
    suonoSpento();
    setTimeout(() => scroll.classList.remove('shake'), 600);
    return;
  }
  if(aperto) return;
  aperto = true;
  suonoSigillo();
  sigillo.classList.add('crack');
  flash.classList.remove('rosso');
  flash.classList.add('go');
  setTimeout(() => {
    scroll.classList.add('open');
    suonoSrotola();
  }, 350);
  setTimeout(() => {
    sigilloWrap.classList.add('via');
    bands.forEach((_, i) => applica(i, false)); // ricalcola con le altezze definitive
    suggerimento.textContent = TESTI.suggerimento;
  }, 1900);
});

/* ── Scintille arcane alla vittoria ──────────── */
function scintille(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const simboli = ['\u2726', '\u2727', '\u22C6'];
  for(let k = 0; k < 30; k++){
    const s = document.createElement('span');
    s.className = 'scintilla' + (k % 3 === 0 ? ' oro' : '');
    s.textContent = simboli[k % simboli.length];
    s.style.left = (4 + Math.random() * 92) + '%';
    s.style.fontSize = (10 + Math.random() * 14) + 'px';
    s.style.animationDuration = (2.6 + Math.random() * 2.4) + 's';
    s.style.animationDelay = (Math.random() * 1.8) + 's';
    paper.appendChild(s);
    setTimeout(() => s.remove(), 7000);
  }
}

/* ── Pulviscolo arcano di sfondo ─────────────── */
if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  for(let k = 0; k < 9; k++){
    const m = document.createElement('span');
    m.className = 'mote';
    const d = 3 + Math.random() * 5;
    m.style.width = m.style.height = d + 'px';
    m.style.left = (Math.random() * 100) + '%';
    m.style.top = (30 + Math.random() * 80) + '%';
    m.style.animationDuration = (14 + Math.random() * 18) + 's';
    m.style.animationDelay = (-Math.random() * 20) + 's';
    document.body.appendChild(m);
  }
}

/* ── Suoni sintetizzati (nessun file esterno) ── */
let audio = null;
let suonoAttivo = true;

/* Su iPhone e Android l'audio parte solo dopo un tocco dell'utente:
   qui sblocco tutto al primo contatto con lo schermo. Il piccolo audio
   silenzioso in loop instrada i suoni sul canale multimediale, che su
   iPhone si sente anche con l'interruttore della suoneria su silenzioso. */
const SILENZIO = "data:audio/wav;base64,UklGRuQSAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YcASAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=";
let silenziatore = null;
function sbloccaAudio(){
  avviaAudio();
  if(audio){
    try{
      const b = audio.createBuffer(1, 1, 22050);
      const s = audio.createBufferSource();
      s.buffer = b; s.connect(audio.destination); s.start(0);
    }catch(e){}
  }
  if(!silenziatore && suonoAttivo){
    try{
      silenziatore = new Audio(SILENZIO);
      silenziatore.loop = true;
      silenziatore.volume = 0.01;
      silenziatore.play().catch(function(){});
    }catch(e){}
  }
}
document.addEventListener('pointerdown', sbloccaAudio, true);

function avviaAudio(){
  if(!audio){
    try{ audio = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ audio = null; }
  }
  if(audio && audio.state === 'suspended') audio.resume();
}

function nota(freq, inizio, durata, tipo = 'sine', volume = 0.12){
  if(!audio || !suonoAttivo) return;
  const t = audio.currentTime + inizio;
  const o = audio.createOscillator();
  const g = audio.createGain();
  o.type = tipo;
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.min(volume * 1.6, 0.5), t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + durata);
  o.connect(g).connect(audio.destination);
  o.start(t);
  o.stop(t + durata + 0.05);
}

function suonoGiro(){
  avviaAudio();
  nota(140, 0, 0.16, 'triangle', 0.16);
  nota(520 + Math.random() * 80, 0.03, 0.12, 'sine', 0.05);
}
function suonoSigillo(){
  nota(90, 0, 0.4, 'triangle', 0.22);
  nota(160, 0.05, 0.3, 'square', 0.06);
}
function suonoSrotola(){
  for(let k = 0; k < 7; k++) nota(180 + k * 12, k * 0.12, 0.14, 'triangle', 0.07);
}
function suonoVittoria(){
  const accordo = [220, 277.18, 329.63, 440, 554.37, 659.25];
  accordo.forEach((f, k) => nota(f, 0.1 + k * 0.14, 1.6, 'sine', 0.09));
  nota(110, 0.1, 2.2, 'triangle', 0.1);
}
function suonoFallimento(){
  const discesa = [330, 262, 208, 156, 110];
  discesa.forEach((f, k) => nota(f, k * 0.18, 0.5, 'triangle', 0.13));
  nota(65, 0.9, 1.4, 'triangle', 0.16);
}
function suonoSpento(){
  nota(70, 0, 0.22, 'triangle', 0.18);
}

suonoBtn.addEventListener('click', () => {
  suonoAttivo = !suonoAttivo;
  suonoBtn.setAttribute('aria-pressed', String(suonoAttivo));
  suonoBtn.style.opacity = suonoAttivo ? '1' : '0.45';
  if(suonoAttivo){ sbloccaAudio(); nota(440, 0, 0.15); }
  else if(silenziatore){ silenziatore.pause(); silenziatore = null; }
});

/* ═══════════════════════════════════════════════════════════
   PANNELLO DEL MASTER (visibile solo con ?dm=1 nell'indirizzo)
   ═══════════════════════════════════════════════════════════ */
const dmAttivo = new URLSearchParams(location.search).get('dm') === '1';
if(dmAttivo) document.body.classList.add('dm-attivo');

function aggiornaDm(){
  if(!dmAttivo) return;
  const el = document.getElementById('dmStato');
  const fine = fineBlocco();
  if(fine > Date.now()){
    const resto = fine - Date.now();
    const ore = Math.floor(resto / 3600000);
    const min = Math.floor((resto % 3600000) / 60000);
    el.textContent = 'Blocco attivo: ' + ore + 'h ' + min + 'm rimanenti';
  } else {
    el.textContent = 'Nessun blocco attivo';
  }
  if(reteOk === true)  el.textContent += ' \u00B7 database online';
  if(reteOk === false) el.textContent += ' \u00B7 database non raggiungibile';
}
if(dmAttivo){
  const nomi = { sole:'Sole', luna:'Luna', stella:'Stella' };
  document.getElementById('dmSoluzione').textContent =
    'Soluzione: ' + SOLUZIONE.map(s => nomi[s]).join(' \u00B7 ');
  document.getElementById('dmSblocca').addEventListener('click', () => {
    sbloccaGlobale();
    if(bloccato) riattiva(); else aggiornaDm();
  });
  document.getElementById('dmRimescola').addEventListener('click', () => {
    if(bloccato) riattiva();
    else { mescola(); }
  });
  setInterval(aggiornaDm, 30000);
  aggiornaDm();
}

/* ═══════════════════════════════════════════════════════════
   AVVIO — ripristina blocco o partita in corso
   ═══════════════════════════════════════════════════════════ */
(function avvia(){
  if(eBloccato()){
    applicaBlocco();
  } else {
    rimuoviBloccoLocale(); // pulizia di un eventuale blocco scaduto
    const salvato = caricaStato();
    if(salvato){
      giri = salvato.giri;
      mosse = salvato.mosse;
      bands.forEach((_, i) => applica(i, false));
      aggiornaContatore();
    } else {
      mescola();
    }
  }
  sincronizzaBlocco(); // verifica subito anche il database condiviso
})();
</script>
